name: Release

on:
  push:
    tags: ['[0-9]*']

# Read-only by default. Only the upload step's job can write, and it installs and builds nothing: it publishes the binary the CI gate tested.
permissions:
  contents: read

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION="${GITHUB_REF_NAME}"
          test "$FILE_VERSION" = "$TAG_VERSION" || { echo "VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"; exit 1; }

      - name: Take the binary CI tested
        # Nothing is built in this job, and no installer runs in it: it is the one that holds contents: write.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: thoth-linux-x86_64
          path: build

      - name: Check it and sum it
        # An artifact loses its mode bits. The version check is the same one the tag has just passed, now of the bytes that ship.
        run: |
          chmod +x build/thoth
          test "$(build/thoth --version | awk '{print $NF}')" = "$(tr -d '[:space:]' < VERSION)"
          (cd build && sha256sum thoth > SHA256SUMS)

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            build/thoth
            build/SHA256SUMS
