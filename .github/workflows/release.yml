name: Release

on:
  push:
    tags: ['[0-9]*']

# Read-only by default. Only the upload step's job can write, so the suite and its installer never run holding that token.
permissions:
  contents: read

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION="${GITHUB_REF_NAME}"
          test "$FILE_VERSION" = "$TAG_VERSION" || { echo "VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"; exit 1; }

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of truth
        # for the toolchain version (CLAUDE.md "no hardcoded toolchain versions
        # in CI YAML") — read the pin and hand it to the upstream installer.
        #
        # Do NOT hand-roll this by untarring the release asset into
        # $HOME/.cyrius/{bin,lib}: that is the pre-6.5.25 layout, and it is
        # what this step replaced at 0.38.6. `cyrius deps` resolves the stdlib
        # snapshot from $HOME/.cyrius/versions/$CYRIUS_VERSION/lib and hard
        # fails with "pins version X but it is not installed" when only the
        # flattened dirs exist — so the hand-rolled block did not merely skip
        # verification, it stopped working outright.
        #
        # Bisected rather than assumed: the flat layout resolves fine at
        # 6.5.24 and fails at 6.5.25, so CI was still GREEN on 0.38.5's 6.5.20
        # pin and this refresh's move to 6.5.35 is exactly what would have
        # turned it red. The installer lays out versions/<v>/{bin,lib} and
        # symlinks bin/ + lib/ at it, and checks the SHA-256 published beside
        # the tarball. A first install has no cyrsign, so on this runner the
        # Ed25519 signature is NOT checked, and that sum comes from the same
        # origin as the tarball. Same pattern as darshana / darshini / patra /
        # libro.
        #
        # CYRIUS_HOME is deliberately NOT exported any more: the installer
        # defaults it to $HOME/.cyrius, and the wrapper appends
        # versions/<pin>/lib to whatever it is set to — so a stale or
        # over-specific value resolves to versions/<v>/versions/<v>/lib.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf "https://raw.githubusercontent.com/MacCracken/cyrius/$CYRIUS_VERSION/scripts/install.sh" | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain layout
        # Guards the exact failure this replaced: a successful-looking install
        # that leaves no versions/<v>/lib snapshot, so every later cyrius
        # invocation dies on dep resolution instead of here, with an error that
        # points at the manifest rather than at the install.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          test -d "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" \
            || { echo "::error::stdlib snapshot missing at ~/.cyrius/versions/$CYRIUS_VERSION/lib"; exit 1; }
          cyrius version
          echo "toolchain ok: pin $CYRIUS_VERSION, snapshot present"

      - name: Build (linux target)
        # The multi-target driver is the single build entry point (M6, 0.6.3).
        # AGNOS is staged but blocked upstream (SYS_LSEEK floor gap), so the
        # release ships the linux x86_64 target -> build/thoth.
        run: |
          cyrius deps --locked
          ./scripts/build.sh linux
          (cd build && sha256sum thoth > SHA256SUMS)

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            build/thoth
            build/SHA256SUMS
