name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:        # lets release.yml reuse this workflow as its CI gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Cyrius toolchain
        # cyrius.cyml's [package].cyrius is the single source of truth for the version (CLAUDE.md: no hardcoded toolchain versions in CI YAML).
        # The script downloads the installer and the tarball, checks both against scripts/toolchain.sums, and only then runs them: on a
        # fresh runner the installer itself has no cyrsign to check a signature with, and trusts a sum from the tarball's own origin.
        # CYRIUS_HOME stays unset: the installer defaults it, and the wrapper appends versions/<pin>/lib to whatever it is set to.
        run: |
          sh scripts/toolchain-install.sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain layout
        # Guards the exact failure this replaced: a successful-looking install
        # that leaves no versions/<v>/lib snapshot, so every later cyrius
        # invocation dies on dep resolution instead of here, with an error that
        # points at the manifest rather than at the install.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          test -d "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" \
            || { echo "::error::stdlib snapshot missing at ~/.cyrius/versions/$CYRIUS_VERSION/lib"; exit 1; }
          cyrius version
          echo "toolchain ok: pin $CYRIUS_VERSION, snapshot present"

      - name: Resolve dependencies
        run: cyrius deps --locked

      - name: Build (linux target)
        # The multi-target driver is the single build entry point (M6, 0.6.3).
        # `linux` builds the shipped x86_64 host target -> build/thoth.
        run: ./scripts/build.sh linux

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test

      - name: Keep the tested binary
        # Release publishes this file, not a rebuild of it: what ships is what the suite ran beside.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thoth-linux-x86_64
          path: build/thoth
          if-no-files-found: error
          retention-days: 7

      - name: Cross lanes (aarch64 / agnos / win) — non-gating
        # 0.43.2: until now CI built ONLY the linux lane, so a regression that
        # broke --agnos, --aarch64 or --win was invisible until someone ran
        # `build.sh all` by hand — while roadmap gate 1 carries "--agnos build
        # ✓" as a standing claim that decays silently between manual checks.
        # The precedent for why this matters is in tests/cases/vendor.cyr: a
        # vendored `SYS_IOCTL = 16` silently miscompiled every aarch64 build
        # and went unnoticed for ~30 releases.
        #
        # `continue-on-error` because these lanes are EXPECTED to gap on
        # substrate primitives (win needs IOCP; agnos targets a syscall ABI
        # this runner cannot execute). build.sh's own `_run_best_effort`
        # already distinguishes a KNOWN_GAP from a real failure and returns
        # non-zero only for the latter — so a red mark here is a real
        # regression worth reading, and it never blocks a merge.
        continue-on-error: true
        run: |
          for t in aarch64 agnos win; do
            echo "::group::lane $t"
            ./scripts/build.sh "$t" || echo "::warning::lane $t did not produce a binary"
            echo "::endgroup::"
          done
